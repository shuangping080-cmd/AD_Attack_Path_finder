name: GenericWrite Service Account
description: GenericWrite over a service account may enable SPN, attribute, or credential-control candidates.
category: ACL
start_types: [User, Group]
required_nodes: [User, ServiceAccount]
required_relationships: [GenericWrite]
required_primitives: [GenericWriteToUser, SPNManipulation, TargetedKerberoast]
optional_relationships: [HasSPN, RunsService, MemberOf]
steps:
  - order: 1
    source_type: User
    relationship: GenericWrite
    target_type: ServiceAccount
    primitive: GenericWriteToUser
    required: true
    confirmed_if_edge_exists: true
  - order: 2
    source_type: ServiceAccount
    relationship: AdminTo
    target_type: Computer
    primitive: ServiceAccountHostImpact
    required: false
    confirmed_if_edge_exists: true
    missing_if_absent:
      question: Does the controlled service account have downstream host privilege?
      relationship: AdminTo
      target_type: Computer
      collector: BloodHound
result:
  type: ServiceIdentityControlCandidate
  description: Current graph proves write access; downstream service or host impact must still be confirmed.
examples:
  - machine: Certified
    chain: User GenericWrite service identity with downstream privilege checks
    confidence: low
confidence: low
source_count: 1
