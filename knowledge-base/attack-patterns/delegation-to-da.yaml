    source_type: User
    relationship: AllowedToDelegate
    target_type: Computer
    primitive: ConstrainedDelegation
    required: true
    confirmed_if_edge_exists: true
  - order: 2
    source_type: Computer
    relationship: HasSession
    target_type: User
    primitive: CredentialExposure
