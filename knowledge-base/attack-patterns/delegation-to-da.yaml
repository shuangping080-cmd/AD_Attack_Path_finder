required_relationships: [AllowedToDelegate, ConstrainedDelegation, UnconstrainedDelegation]
required_primitives: [ConstrainedDelegation, UnconstrainedDelegation, S4U]
optional_relationships: [HasSession, AdminTo]
steps:
