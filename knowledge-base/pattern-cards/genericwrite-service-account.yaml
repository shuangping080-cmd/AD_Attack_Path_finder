id: genericwrite-service-account
machine: Multiple
category: privilege_escalation
primitive: ServiceAccountControlCandidate
source_object_type: User
trigger_keywords:
  - GenericWrite
  - service account
  - SPN
  - targeted kerberoast
  - shadow credentials
object_indicators:
  - target is ServiceAccount or User with service-account naming
  - target may have SPN or service role
graph_indicators:
  - User --GenericWrite--> ServiceAccount
  - Group --GenericWrite--> ServiceAccount
  - Computer --GenericWrite--> ServiceAccount
property_indicators:
  - target has serviceprincipalnames
  - target samaccountname starts with svc
relationship_indicators:
  - GenericWrite
hypothesis:
  description: GenericWrite over a service account can enable multiple primitives depending on target properties and writable attributes.
  primitive_sequence:
    - SPNManipulationCandidate
    - TargetedKerberoastCandidate
    - ShadowCredentialsCandidate
    - IdentityControlCandidate
validation:
  commands:
    - "confirm which attributes are writable on {target}"
    - "check SPN presence and whether servicePrincipalName can be modified"
    - "check whether msDS-KeyCredentialLink can be written"
required_evidence:
  - GenericWrite exists in current graph
  - target object type and properties are known
  - required attribute write is confirmed
missing_information:
  - writable attributes on target
  - target SPN state
  - downstream privileges of the service account
  - hash cracking or credential recovery outcome
next_steps:
  - enumerate target attributes via LDAP
  - identify downstream group membership, sessions, AdminTo, delegation, ADCS, gMSA, and dMSA impact
  - keep individual primitives candidate/incomplete until their preconditions are satisfied
confidence:
  initial: medium
  with_target_properties: medium
  after_attribute_confirmation: high
risk_if_valid: identity control or credential access
collection_cost: medium
historical_examples:
  - machine: Generic
    source: controlled principal
    target: service account
    relationship: GenericWrite
    primitive: ServiceAccountControlCandidate
    evidence:
      source_file: knowledge-base/primitives
      excerpt: Relationship plus object type and preconditions determine the primitive.
