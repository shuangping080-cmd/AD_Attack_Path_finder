id: htb-vintage-pre2k-computer-password
machine: Vintage
category: initial_access
primitive: Pre2KComputerPassword
source_object_type: Computer
trigger_keywords:
  - pre-windows 2000
  - compatible computer
  - machine account
  - computer password
  - hostname password
object_indicators:
  - sAMAccountName endswith "$"
  - hostname-like computer name
  - pre-windows 2000 compatible access membership
graph_indicators:
  - Computer --MemberOf--> PRE-WINDOWS 2000 COMPATIBLE ACCESS
property_indicators:
  - samaccountname endswith "$"
  - enabled is true
relationship_indicators:
  - MemberOf
hypothesis:
  description: Computer account may use lowercase hostname as initial password.
  username_template: "{hostname}$"
  password_template: "{hostname_lower}"
validation:
  commands:
    - "netexec ldap {dc} -d {domain} -u '{hostname}$' -p '{hostname_lower}' -k"
required_evidence:
  - computer account exists
  - kerberos or ldap authentication succeeds
missing_information:
  - whether account password is still the initial hostname-derived value
risk_if_valid: initial foothold as machine account
collection_cost: low
confidence:
  initial: medium
  after_auth_success: confirmed
next_steps:
  - mark the computer account as a controlled principal
  - rerun BloodHound collection as the machine account
  - enumerate LDAP readable objects
  - check ACL, delegation, RBCD, ADCS, gMSA, and dMSA visibility
historical_examples:
  - machine: Vintage
    source: FS01
    target: FS01
    relationship: MemberOf
    primitive: Pre2KComputerPassword
    evidence:
      source: local_knowledge_base
      note: Public pattern card only; source writeup evidence is stored in the local KB.
